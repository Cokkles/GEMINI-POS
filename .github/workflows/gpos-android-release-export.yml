name: GPOS Android Release Export

on:
  push:
    branches:
      - agent/android-0.7.5.1-nutrition-reliability
    paths:
      - '.github/workflows/gpos-android-release-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified private prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download android-0.7.5.1-nutrition-reliability-test \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'AEGIS-Android-0.7.5.1-nutrition-reliability.apk'

      - name: Verify published APK digest
        run: |
          echo 'a149d5f459a738bef2ce5cac603aa3ff3897ccaa780eb002ffb264d81ff40e1b  AEGIS-Android-0.7.5.1-nutrition-reliability.apk' | sha256sum --check

      - name: Export APK for connected handoff
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-0.7.5.1-release-apk
          path: AEGIS-Android-0.7.5.1-nutrition-reliability.apk
          compression-level: 0
          if-no-files-found: error
