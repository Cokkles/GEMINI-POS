name: GPOS Android Checkpoint

on:
  push:
    branches:
      - agent/gpos-android-foundation
      - agent/android-0.7.1-daily-reliability
      - agent/android-0.7.2-daily-customization
      - agent/android-0.7.3-offline-sync
      - agent/android-0.7.4-auth-continuity
      - agent/android-0.7.4.2-capture-transport
      - agent/android-0.7.5-session-background
      - agent/android-0.7.5.1-nutrition-reliability
      - agent/android-0.7.6-reliability-auth
    paths:
      - 'android/**'
      - '.github/workflows/gpos-android-checkpoint.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/gpos-android-checkpoint.yml'
  workflow_dispatch:

concurrency:
  group: gpos-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate and assemble checkpoint APKs
        run: gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify package and deterministic checkpoint certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | head -n 1 | tee android/app/build/outputs/apk/debug/package-metadata.txt
          grep -q "name='com.cokkles.gpos'" android/app/build/outputs/apk/debug/package-metadata.txt
          grep -q "versionCode='21'" android/app/build/outputs/apk/debug/package-metadata.txt
          grep -q "versionName='0.7.6'" android/app/build/outputs/apk/debug/package-metadata.txt
          {
            echo "package=com.cokkles.gpos"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
              | sed -n '/Signer #1 certificate SHA-1 digest:/p;/Signer #1 certificate SHA-256 digest:/p'
          } | tee android/app/build/outputs/apk/debug/signing-fingerprint.txt
          grep -qi 'd2a0806649d000b1b84fff45a9c6df768dfc31ea' android/app/build/outputs/apk/debug/signing-fingerprint.txt
          grep -qi 'a6cc789c3d294886dab55da142105aaab0df20b40c3718140325a87da461f8ac' android/app/build/outputs/apk/debug/signing-fingerprint.txt

      - name: Package verified Android test release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AEGIS-Android-0.7.6-reliability-auth.apk
          zip -j AEGIS-Android-0.7.6-verified-ci.zip \
            AEGIS-Android-0.7.6-reliability-auth.apk \
            android/app/build/outputs/apk/debug/signing-fingerprint.txt \
            android/app/build/outputs/apk/debug/package-metadata.txt
          sha256sum AEGIS-Android-0.7.6-reliability-auth.apk AEGIS-Android-0.7.6-verified-ci.zip \
            | tee AEGIS-Android-0.7.6-SHA256SUMS.txt

      - name: Publish private GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='android-0.7.6-reliability-auth-test'
          assets=(
            AEGIS-Android-0.7.6-reliability-auth.apk
            AEGIS-Android-0.7.6-verified-ci.zip
            AEGIS-Android-0.7.6-SHA256SUMS.txt
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'AEGIS Android 0.7.6 Queue and Auth Reliability Test' \
              --notes 'Private test checkpoint. Stable-ID server-side nutrition processing and status polling, explicit accepted/waiting/review UI states, duplicate-tap suppression, JWT expiry scheduling, recurring silent authorization renewal, and bounded auth backoff. Uses Apps Script 2.8.2 async capabilities when deployed and remains compatible with the 2.8.1/legacy capture path.' \
              --prerelease
          fi

  navigation-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual launcher navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Pictures/AEGIS-Tests android/workspace-screenshots
      - name: Upload navigation results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-0.7.6-navigation-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/workspace-screenshots/
          if-no-files-found: warn
